<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff8533" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff5500" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Basketball Body -->
  <circle cx="32" cy="32" r="28" fill="url(#ballGrad)" filter="url(#glow)"/>
  <!-- Basketball Ribs / Seams -->
  <path d="M4 32h56" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 4v56" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 8c12 14 12 34 0 48" stroke="#1c1917" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M50 8c-12 14-12 34 0 48" stroke="#1c1917" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Document Emblem in Center -->
  <rect x="22" y="20" width="20" height="24" rx="3" fill="#ffffff" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="26" y1="26" x2="38" y2="26" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="31" x2="38" y2="31" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="36" x2="34" y2="36" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Highlight Shine -->
  <ellipse cx="22" cy="16" rx="8" ry="4" fill="#ffffff" opacity="0.35" transform="rotate(-30 22 16)"/>
